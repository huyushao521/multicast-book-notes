<text x='600' y='340' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11.5' fill='#666666' text-anchor='middle' font-weight='normal'>PIM Anycast-RP：靠 MSDP 同步 + Register 复制，无 SA 依赖</text>
<text x='30' y='60' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11.5' fill='#666666' text-anchor='start' font-weight='normal'>核心要点：任何cast IP 相同，路由最优路径收敛到最近 RP；</text>
<text x='30' y='78' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11.5' fill='#666666' text-anchor='start' font-weight='normal'>MSDP Anycast-RP 需在 RP 上配置 msdp originator-id，并保留 SA 中的 RP-id</text>
