<text x='30' y='60' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11.5' fill='#666666' text-anchor='start' font-weight='normal'>AutoRP：候选 RP 宣告 + 映射代理仲裁，仅 IPv4、仅 ASM、需单播路由到 224.0.1.39/32</text>
<text x='30' y='380' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11.5' fill='#666666' text-anchor='start' font-weight='normal'>BSR：候选 RP → BSR → Bootstrap 报文(224.0.0.13)分发 group→RP 映射，支持标准 group-list / ACL</text>
<text x='30' y='398' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11.5' fill='#666666' text-anchor='start' font-weight='normal'>Embedded-RP：IPv6/静态 RP 常用，RP 地址内嵌于组播地址（RFC 4607）</text>
