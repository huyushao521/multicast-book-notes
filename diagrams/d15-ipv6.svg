<svg xmlns='http://www.w3.org/2000/svg' width='900' height='380' viewBox='0 0 900 380'>
<rect width='900' height='380' fill='#ffffff'/>
<text x='450.0' y='26' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='16' font-weight='bold' fill='#1f4e79' text-anchor='middle'>D15  IPv6 组播：MLD 与 Embedded-RP</text>
<g><rect x='75.0' y='104.0' width='90' height='32' rx='3' fill='#fde9d9' stroke='#1f4e79' stroke-width='1.4'/>
<rect x='83.0' y='95.0' width='74' height='9' fill='#fde9d9' stroke='#1f4e79' stroke-width='1.4'/>
<text x='120' y='124' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11' text-anchor='middle' fill='#222'>IPv6 源</text></g>
<g><rect x='215.0' y='96.0' width='130' height='48' rx='6' fill='#eaf3e0' stroke='#1f4e79' stroke-width='1.6'/>
<text x='280' y='124' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='12' text-anchor='middle' fill='#222'>L2 交换机
(MLD Snooping)</text></g>
<g><circle cx='460' cy='120' r='26' fill='#dbe9f6' stroke='#1f4e79' stroke-width='1.6'/>
<path d='M 449 113 L 471 113 M 449 120 L 471 120 M 449 127 L 471 127' stroke='#1f4e79' stroke-width='1.6'/>
<text x='460' y='162' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='12' text-anchor='middle' fill='#222'>DR / RP
(FF02::2:FFxx:xxxx)</text></g>
<g><circle cx='700' cy='120' r='26' fill='#dbe9f6' stroke='#1f4e79' stroke-width='1.6'/>
<path d='M 689 113 L 711 113 M 689 120 L 711 120 M 689 127 L 711 127' stroke='#1f4e79' stroke-width='1.6'/>
<text x='700' y='162' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='12' text-anchor='middle' fill='#222'>上游 (PD)</text></g>
<line x1='170' y1='120' x2='210' y2='120' stroke='#1f4e79' stroke-width='1.6'/>
<line x1='345' y1='120' x2='400' y2='120' stroke='#1f4e79' stroke-width='1.6'/>
<text x='372.5' y='114.0' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11' text-anchor='middle' fill='#1f4e79'>MLDv2 Report</text>
<line x1='520' y1='120' x2='640' y2='120' stroke='#1f4e79' stroke-width='1.6'/>
<text x='30' y='60' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11.5' fill='#666666' text-anchor='start' font-weight='normal'>MLD ≈ IGMP：MLDv1 (对应 IGMPv2)、MLDv2 (对应 IGMPv3，支持 (G,S))</text>
<text x='30' y='78' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11.5' fill='#666666' text-anchor='start' font-weight='normal'>地址：FF00::/8；作用域 2=链路、5=站点、8=组织、0=全球；无 Admin-Scope 边界，用 scope 划分</text>
<rect x='150' y='210' width='600' height='130' rx='6' fill='#fdf9f0' stroke='#c00000' stroke-width='1.3'/>
<text x='165' y='235' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='13' fill='#c00000' text-anchor='start' font-weight='bold'>Embedded-RP (RFC 4607)</text>
<text x='165' y='260' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11.5' fill='#333' text-anchor='start' font-weight='normal'>组地址 FF7x:...::/64 中嵌入 RP：末 32 bit = FF02::FFxx:xxxx（RPA）</text>
<text x='165' y='282' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11.5' fill='#333' text-anchor='start' font-weight='normal'>前提：接收端已配置 ipv6 unicast-routing 且能解析到 RPA 地址</text>
<text x='165' y='304' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11.5' fill='#333' text-anchor='start' font-weight='normal'>优点：无需 MSDP 即可跨域；SSM 段 FF3x::/32 天然无需 RP</text>
<text x='165' y='326' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11.5' fill='#333' text-anchor='start' font-weight='normal'>对比 IPv4：IPv6 用 scope 而非 239/8 + BGR 边界来划分域</text>
</svg>
