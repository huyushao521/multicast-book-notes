<text x='632' y='138' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11' fill='#333' text-anchor='start' font-weight='normal'>3. 默认 peer：源自 AS 内最近的路由器</text>
<text x='632' y='156' font-family='Segoe UI,Microsoft YaHei,sans-serif' font-size='11' fill='#333' text-anchor='start' font-weight='normal'>4. 首跳 AS 匹配 → 直接接受</text>
